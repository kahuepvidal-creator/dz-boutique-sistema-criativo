<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Modelo · stories 1080x1920</title>
<link rel="stylesheet" href="../../marca/componentes.css">
<style>
  /* Stories: o Instagram cobre ~250 px no topo e ~340 px embaixo. Nada importante nessas faixas. */
  .stories .logo-rodape { bottom: 360px; }
  .stories .meta { top: 270px; }
</style>
</head>
<!-- Modelo de stories. Três formatos que se repetem: foto com legenda, quadro de bairro com uma informação curta, frase sobre o fundo 3D.
     Copie para pecas/stories/<nome>.html. -->
<body>

<!-- A · foto com legenda -->
<section class="peca stories">
  <div class="foto escurecida" style="background-image: url(../../marca/fotos/imoveis/co-02.jpg); background-position: 30% 50%"></div>
  <img class="marca-dagua" src="../../marca/logos/svg/dz-boutique-simbolo-dourado.svg" alt="" style="top: 270px">
  <div class="conteudo etiqueta" style="bottom: 420px">
    <p class="bairro">Orla</p>
    <h1 class="titulo" style="margin-top: 24px">Cobertura duplex<br>com <em>vista mar</em></h1>
    <p class="linha" style="margin-top: 30px">000 m² · 0 suítes · 0 vagas</p>
  </div>
</section>

<!-- B · quadro de bairro -->
<section class="peca stories">
  <div class="foto" style="background-image: url(../../marca/quadros-bairros/qs-leblon-azul.jpg)"></div>
  <p class="meta esq">Esta semana</p>
  <div class="conteudo" style="bottom: 560px">
    <h1 class="titulo xl">Leblon</h1>
    <p class="bairro" style="margin-top: 26px">3 imóveis novos</p>
  </div>
  <img class="logo-rodape" src="../../marca/logos/svg/dz-boutique-horizontal-2-linhas-dourado-areia.svg" alt="Dz Boutique Imobiliária">
</section>

<!-- C · frase no fundo 3D -->
<section class="peca stories">
  <div class="fundo-3d"></div>
  <div class="moldura"></div>
  <div class="conteudo" style="top: 720px">
    <h1 class="titulo xl">Curadoria<br><em>em vez de volume.</em></h1>
  </div>
  <img class="logo-rodape" src="../../marca/logos/svg/dz-boutique-horizontal-2-linhas-dourado-areia.svg" alt="Dz Boutique Imobiliária">
</section>

</body>
</html>
