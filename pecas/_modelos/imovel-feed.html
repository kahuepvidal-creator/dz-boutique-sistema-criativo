<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Modelo · imóvel no feed 1080x1350</title>
<link rel="stylesheet" href="../../marca/componentes.css">
</head>
<!-- Modelo de post de imóvel (feed 4:5), em 3 telas: foto forte, ficha, fechamento.
     Copie para pecas/posts/<codigo>-<bairro>.html. Fotos do imóvel em marca/fotos/imoveis/ (ou numa pasta do imóvel).
     Texto do anúncio (tipologia, metragem, rua) vem da equipe, palavra por palavra. Nunca invente número ou preço. -->
<body>

<!-- 01 · foto forte (terraço, mar ou sala com luz) -->
<section class="peca">
  <div class="foto escurecida" style="background-image: url(../../marca/fotos/imoveis/co-15.jpg); background-position: 70% 50%"></div>
  <img class="marca-dagua" src="../../marca/logos/svg/dz-boutique-simbolo-dourado.svg" alt="">
  <div class="conteudo" style="bottom: 290px">
    <p class="bairro">Copacabana</p>
    <h1 class="titulo" style="margin-top: 22px">Cobertura com<br><em>vista para o mar</em></h1>
  </div>
  <img class="logo-rodape" src="../../marca/logos/svg/dz-boutique-horizontal-2-linhas-dourado-areia.svg" alt="Dz Boutique Imobiliária">
  <p class="arraste">Arraste →</p>
</section>

<!-- 02 · ficha -->
<section class="peca">
  <div class="fundo-3d"></div>
  <div class="moldura"></div>
  <p class="meta esq">Copacabana · CO0000</p>
  <p class="meta dir">02 / 03</p>
  <div class="conteudo" style="top: 240px">
    <h2 class="titulo m">A duas quadras<br>da praia.</h2>
    <div class="lista" style="margin-top: 60px">
      <div><p class="nome">000 m²</p><p class="cargo">Área privativa</p></div>
      <div><p class="nome">0 suítes</p><p class="cargo">Quartos</p></div>
      <div><p class="nome">0 vagas</p><p class="cargo">Garagem</p></div>
    </div>
  </div>
  <img class="logo-rodape" src="../../marca/logos/svg/dz-boutique-horizontal-2-linhas-dourado-areia.svg" alt="Dz Boutique Imobiliária">
</section>

<!-- 03 · fechamento claro -->
<section class="peca claro">
  <img class="textura-monograma" src="../../marca/logos/svg/dz-boutique-simbolo-dourado.svg" alt="">
  <div class="moldura"></div>
  <p class="meta dir">03 / 03</p>
  <div class="conteudo" style="top: 330px">
    <h2 class="titulo">Agende<br>uma <em>visita</em>.</h2>
    <div class="fio"></div>
    <p class="texto">21 96710-2173<br>dzboutiqueimobiliaria.com.br</p>
  </div>
  <img class="logo-rodape" src="../../marca/logos/svg/dz-boutique-horizontal-2-linhas-dourado-escuro-cagarras.svg" alt="Dz Boutique Imobiliária">
</section>

</body>
</html>
