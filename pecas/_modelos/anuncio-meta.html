<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Modelo · anúncio Meta Ads · carrossel 1080x1350</title>
<link rel="stylesheet" href="../../marca/componentes.css">
</head>
<!-- Modelo de anúncio de imóvel para Meta Ads (Instagram e Facebook), carrossel 4:5.
     Card 1: foto + caixa Areia com textura (bairro, tipologia, metragem, suítes, vagas, preço, "Ver imóveis").
     Cards do meio: só a foto, grande e sangrada. Último card: convite para falar com a Dz.
     Copie para pecas/anuncios/<codigo>-<bairro>.html. Todos os números vêm da ficha que a equipe mandou,
     palavra por palavra. Preço só se a equipe mandar; se não mandar, apague o bloco .preco. -->
<body>

<!-- 01 · capa do anúncio: caixa embaixo (padrão) -->
<section class="peca">
  <div class="foto" style="background-image: url(../../marca/fotos/imoveis/co-15.jpg); background-position: 70% 30%"></div>
  <img class="marca-dagua" src="../../marca/logos/svg/dz-boutique-simbolo-dourado.svg" alt="">
  <div class="caixa-anuncio">
    <p class="bairro">Orla · quadra da praia</p>
    <h1 class="tipo">Cobertura com<br><em>vista para o mar</em></h1>
    <p class="linha">000 m² · 0 suítes · 0 vagas</p>
    <div class="base">
      <div><p class="rotulo">Venda</p><p class="preco">R$ 0.000.000</p></div>
      <span class="botao-contorno">Ver imóvel</span>
    </div>
  </div>
</section>

<!-- 02 · só a foto -->
<section class="peca">
  <div class="foto" style="background-image: url(../../marca/fotos/imoveis/co-22.jpg); background-position: 50% 50%"></div>
</section>

<!-- 03 · só a foto -->
<section class="peca">
  <div class="foto" style="background-image: url(../../marca/fotos/imoveis/co-02.jpg); background-position: 40% 50%"></div>
</section>

<!-- 04 · convite (fechamento) -->
<section class="peca claro">
  <div class="conteudo" style="top: 110px">
    <p class="sobrelinha">Fale com a gente</p>
  </div>
  <div class="conteudo" style="top: 320px">
    <h2 class="titulo-editorial" style="font-size: 128px">Agende uma <em>visita</em>.</h2>
    <p class="texto" style="margin-top: 52px">Atendimento de perto, do primeiro contato à entrega das chaves.</p>
    <div style="margin-top: 52px; color: var(--cagarras)"><span class="botao-contorno">Fale no WhatsApp</span></div>
    <p class="texto" style="margin-top: 32px; font-size: var(--texto-apoio)">21 96710-2173 · @dzboutiqueimobiliaria</p>
  </div>
  <img class="logo-rodape" src="../../marca/logos/svg/dz-boutique-horizontal-2-linhas-dourado-escuro-cagarras.svg" alt="Dz Boutique Imobiliária">
</section>

</body>
</html>
